name: code_quest
description: Code Quest MVP (Flutter)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  firebase_core: ^2.30.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  provider: ^6.0.5
  pdfx: ^2.6.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/mcq_data.json
    - assets/data/interview_material.json
    - assets/data/debug_questions.json
    - assets/data/aptitude_questions.json
    - assets/data/debug/basic.json
    - assets/data/mcq/os/level1.json
    - assets/data/mcq/dbms/level1.json
    - assets/data/mcq/cn/level1.json
    - assets/data/mcq/oop/level1.json
    - assets/data/mcq/dsa/level1.json
    - assets/data/mcq/cd/level1.json
    - assets/interview_pdfs/sample.pdf

dependency_overrides:
